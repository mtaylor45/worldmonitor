# Sidecar plus Ollama, as deployed on the kiosk.
#
#   docker compose -f voice-sidecar/docker-compose.yml up -d
#
# Host networking throughout: the dashboard, Ollama and the sidecar are all on
# the same machine, and bridging them would add a hop for no isolation benefit
# on a single-user LAN appliance.
services:
  voice:
    build: .
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - wm-voice-models:/models
    environment:
      WM_LLM_URL: http://127.0.0.1:8080/v1
      WM_LLM_MODEL: qwen3-8b-q4_k_m
      # Non-thinking by default. A chain of thought the user never hears is
      # latency spent on nothing, and it is the biggest per-turn saving here.
      WM_LLM_THINKING: "0"
      WM_API_URL: http://127.0.0.1:3000
      WM_STT_MODEL: small.en
      WM_TTS_VOICE: af_sarah
      # Wake word: "Computer". openWakeWord ships no pretrained model for it,
      # so this points into the mounted model volume and is empty until one is
      # trained (docs/VOICE-CHARACTER.md). Empty means push-to-talk only, said
      # loudly at startup rather than a system that looks like it is listening.
      WM_WAKE_MODEL: ""
      # 0.7, not openWakeWord's 0.5: "Computer" occurs in ordinary speech, so
      # false accepts are the design problem here. Tune against the 24-hour
      # test, in the room the panel lives in.
      WM_WAKE_THRESHOLD: "0.7"
      WM_WAKE_CONSECUTIVE: "2"
    restart: unless-stopped

  # llama.cpp rather than Ollama: native Qwen tool-call parsing, an explicit
  # thread count, and AVX2 builds - which matter on a Skylake part. Ollama
  # still works; point WM_LLM_URL at :11434/v1 and it speaks the same API.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    network_mode: host
    volumes:
      - wm-llm-models:/models
    command: >
      --model /models/qwen3-8b-q4_k_m.gguf
      --alias qwen3-8b-q4_k_m
      --host 127.0.0.1 --port 8080
      --ctx-size 8192
      --threads 8
      --jinja
    restart: unless-stopped

volumes:
  wm-voice-models:
  wm-llm-models:
