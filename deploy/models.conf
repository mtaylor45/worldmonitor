# Model weights the panel needs, with verified checksums.
#
#   <destination>|<url>|<sha256>
#
# `make -C deploy models` fetches anything missing and verifies every file
# against the hash below, on every run. A hash mismatch is a hard failure:
# these are multi-gigabyte binaries fetched over the network onto a machine
# that then runs them, and "probably fine" is not a security posture.
#
# The sha256 values were read from Hugging Face's own paths-info API (the
# `lfs.oid` field, which is the sha256 for LFS objects) rather than computed
# from a local download, so they verify the upstream artefact rather than
# whatever arrived here first.
#
# Two things are deliberately NOT listed:
#
#   Kokoro  — the `kokoro` Python package fetches its own weights on first use.
#   Wake    — openWakeWord ships no "computer" model, so there is nothing to
#             fetch. Train one (docs/VOICE-CHARACTER.md) and point
#             WM_WAKE_MODEL at it.

